<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mantiqueira</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="estilo.css">
<style>
.mini{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 36%,var(--bg1) 0%,transparent 62%),linear-gradient(160deg,#10151f 0%,#05080d 100%);
  border:1px solid var(--p3);display:flex;flex-direction:column;align-items:center;padding:16px 22px 14px;gap:10px}
.mtopo{width:100%;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:10px;letter-spacing:2px;color:var(--mu)}
.mx{width:30px;height:30px;background:transparent;border:1px solid var(--p3);color:var(--tx);cursor:pointer;font-family:var(--f-mono)}
.m1{transform-origin:150px 150px;animation:spin 30s linear infinite}
.m2{transform-origin:150px 150px;animation:spinr 12s linear infinite}
.m3{transform-origin:150px 150px;animation:spin 6s linear infinite}
.rapido .m2{animation-duration:4s}.rapido .m3{animation-duration:2s}
.meq{display:flex;align-items:center;justify-content:center;gap:3px;height:24px}
.meq div{width:3px;background:var(--p);transform:scaleY(.2)}
.mu1{font-family:var(--f-mono);font-size:12px;color:var(--mu);letter-spacing:1px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ma{font-size:17px;line-height:1.4;color:var(--hi);text-align:center;max-height:124px;overflow:hidden}
.mal{width:100%;padding:12px 14px;border:1px solid var(--al);background:rgba(var(--agl),.08)}
.mal .t{font-size:19px;font-weight:600;color:var(--hi);margin-top:4px}
</style>
</head>
<body>
<div class="mini" id="mini">
  <div class="mtopo">
    <span class="disp brilho" style="font-size:11px;letter-spacing:4px;color:var(--hi)">MANTIQUEIRA</span>
    <span style="display:flex;gap:6px">
      <button type="button" class="mx" id="mAbrir" aria-label="Abrir tela principal" title="Abrir tela principal">▢</button>
      <button type="button" class="mx" id="mFechar" aria-label="Fechar" title="Fechar (Esc)">✕</button>
    </span>
  </div>
  <svg class="hsvg" width="240" height="240" viewBox="0 0 300 300" role="img" aria-label="Mantiqueira ativo">
    <defs><radialGradient id="mg" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:var(--hi);stop-opacity:.9"/><stop offset="30%" style="stop-color:var(--p);stop-opacity:.4"/><stop offset="100%" style="stop-color:var(--p3);stop-opacity:0"/></radialGradient>
    <path id="ml" d="M150 150 m-120 0 a120 120 0 1 1 240 0 a120 120 0 1 1 -240 0"/></defs>
    <g class="m1"><path id="mtk" style="stroke:var(--p)" stroke-width="1.1" fill="none"/></g>
    <g class="m1"><text font-family="Share Tech Mono, Consolas, monospace" font-size="9" letter-spacing="3" style="fill:var(--p)"><textPath href="#ml">PROCESSAMENTO LOCAL ··· NENHUM DADO SAI DESTE PC ··· MANTIQUEIRA ··· </textPath></text></g>
    <g class="m2"><circle cx="150" cy="150" r="102" fill="none" style="stroke:var(--p)" stroke-width="2" stroke-dasharray="80 20 4 20 50 30 10 200"/></g>
    <circle cx="150" cy="150" r="88" fill="none" style="stroke:var(--pd)" stroke-width="10" stroke-dasharray="2 2"/>
    <path id="marc" style="stroke:var(--p)" stroke-width="10" fill="none" stroke-dasharray="2 2"/>
    <g class="m3"><circle cx="150" cy="150" r="74" fill="none" style="stroke:var(--p2)" stroke-width="1" stroke-dasharray="20 8 3 8"/></g>
    <circle class="respira" cx="150" cy="150" r="64" fill="url(#mg)"/>
    <circle cx="150" cy="150" r="54" fill="none" style="stroke:var(--p)" stroke-width="1.2"/>
    <path d="M112 150 L126 133 L134 141 L148 118 L158 133 L166 126 L188 150" fill="none" style="stroke:var(--hi)" stroke-width="1.8" stroke-linejoin="round"/>
    <text id="mEst" x="150" y="172" text-anchor="middle" font-family="Share Tech Mono, Consolas, monospace" font-size="9" letter-spacing="3" style="fill:var(--p)">ESCUTANDO</text>
  </svg>
  <div class="meq" id="meq" aria-hidden="true"></div>
  <div id="mAl" class="mal" hidden>
    <div class="mono al" style="font-size:11px;letter-spacing:3px">LEMBRETE · <span id="mAlH"></span></div>
    <div class="t" id="mAlT"></div>
    <div class="botoes"><button type="button" class="btn btnA" id="mOk">CONCLUÍDO</button><button type="button" class="btn" id="mAdiar">ADIAR 10 MIN</button></div>
  </div>
  <div id="mConv" style="width:100%;display:flex;flex-direction:column;gap:8px;align-items:center">
    <div class="mu1" id="mU"> </div>
    <div class="ma brilho" id="mA"> </div>
  </div>
  <div class="mono" style="margin-top:auto;font-size:10px;letter-spacing:2px;color:var(--mu)">ESC · FECHAR</div>
</div>
<script src="comum.js"></script>
<script>
(function(){
  $('mtk').setAttribute('d', marcacoes(150,150,142,3,15,4,10));
  $('marc').setAttribute('d', arco(150,150,88,-30,200));
  var eq = $('meq'), barras = [], est = 'ocioso', nivel = 0, ult = null;
  for (var i = 0; i < 44; i++){ var b = document.createElement('div'); var k = 1 - Math.abs(i-21.5)/22; b.style.height = Math.round(4 + 18*(.3+.7*k)) + 'px'; eq.appendChild(b); barras.push(b); }
  function quadro(t){
    var alvo = est === 'gravando' ? 1 : (est === 'falando' ? .8 : (est === 'pensando' || est === 'transcrevendo' ? .35 : .08));
    nivel += (alvo - nivel) * .15;
    for (var j = 0; j < barras.length; j++){ var v = nivel * (.35 + .65*Math.abs(Math.sin(t/170 + j*.7))); barras[j].style.transform = 'scaleY(' + Math.max(.12, v).toFixed(2) + ')'; }
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
  function render(e){
    ult = e; aplicarTema(e.tema); est = e.estado;
    $('mini').classList.toggle('rapido', est === 'pensando' || est === 'transcrevendo');
    $('mEst').textContent = rotuloEstado(e);
    var a = e.alerta;
    $('mAl').hidden = !a; $('mConv').hidden = !!a && est !== 'falando';
    if (a){ $('mAlH').textContent = a.hora; $('mAlT').textContent = a.texto; }
    var u = e.ultima || {};
    $('mU').textContent = est === 'gravando' ? 'Pode falar…' : (u.usuario ? 'VOCÊ › ' + u.usuario : ' ');
    $('mA').textContent = (est === 'gravando' || est === 'transcrevendo') ? ' ' : (est === 'pensando' ? '…' : (u.assistente ? '“' + u.assistente + '”' : ' '));
  }
  function atualizar(){ chamar('estado').then(render).catch(function(){}).then(function(){ setTimeout(atualizar, 400); }); }
  atualizar();
  $('mFechar').addEventListener('click', function(){ chamar('esconder_mini'); });
  $('mAbrir').addEventListener('click', function(){ chamar('mostrar_principal'); });
  $('mOk').addEventListener('click', function(){ if (ult && ult.alerta) chamar('lembrete', ult.alerta.id, 'concluir'); });
  $('mAdiar').addEventListener('click', function(){ if (ult && ult.alerta) chamar('lembrete', ult.alerta.id, 'adiar'); });
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') chamar('esconder_mini'); });
})();
</script>
</body>
</html>
